name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # Skip checks that depend on external/repo-settings state this fork
          # doesn't satisfy: brands (venice_ai isn't in home-assistant/brands)
          # and topics (no GitHub repository topics assigned).
          # NOTE: the `issues` check also fails because the repository has its
          # Issues feature disabled; enable it in Settings to clear that check.
          ignore: "brands topics"
